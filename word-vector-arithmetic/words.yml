# Every word the experiments touch. Nothing is hardcoded in a script, so the
# committed slice in vectors-slice.txt is exactly derivable from this file.
#
# THE SEED IS ONE PAIR, ON PURPOSE. The talk derives the plural direction from
# cat and cats alone and then asks other words about it. Averaging over many
# pairs is the obvious improvement, so it is a second condition here rather
# than a replacement: the question is how much the one-pair version gives up.
#
# TRAINING AND TEST ARE DISJOINT. direction_training feeds the averaged
# direction only. No pair appears in both lists, and the seed appears in
# neither, so every reported number is on words the direction never saw.
#
# HALF THE TEST SET IS IRREGULAR. A direction derived from cats - cat could be
# picking up the letter s rather than the idea of plurality. men, mice, feet and
# criteria share no suffix with cats, so they separate the two explanations.
# Reporting regular and irregular together would hide that.
#
# THE ANALOGY TARGET IS NEVER AN INPUT. For each quadruple the experiment
# computes b - a + c and ranks all 400k words against it. d is what a correct
# answer would be, and it is never one of a, b, c.

