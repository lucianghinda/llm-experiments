# Ground truth for every planted bug.
#
# Each bug is a real merged fix commit from the app's own history. Planting
# applies that commit's implementation diff backwards and keeps its regression
# test, so the failing test is the one the maintainer actually wrote for the
# defect.
#
# Every fix_sha here was checked with probe_candidates.rb: its implementation
# hunks still apply backwards to the base branch. Commits whose files were
# rewritten later cannot be planted and are not listed, however good the bug.
#
# domain_hint is the whole cond-none hint block. Rule: no path fragment, and no
# word that matches a defect-file or test-file basename.
# hint_paths is what cond-bare and cond-at list, in this order. The line numbers
# are computed at render time from the planted branch, never hand-written.

bugs:
  - id: campfire-01
    app: campfire
    slug: nat64-recheck
    fix_sha: 4cfcc2a
    impl_files:
      - lib/restricted_http/private_network_guard.rb
    test_file: test/lib/restricted_http/private_network_guard_test.rb
    domain_hint: "The outbound fetch safety check refuses a destination it should allow: one whose address embeds a reachable public target inside a transition-prefix form."
    hint_paths:
      - test/lib/restricted_http/private_network_guard_test.rb
      - lib/restricted_http/private_network_guard.rb

  - id: postcraftstudio-01
    app: postcraftstudio
    slug: bearer-401-message
    fix_sha: c337218
    impl_files:
      - app/controllers/concerns/api_auth.rb
    test_file: test/controllers/api/base_controller_test.rb
    domain_hint: "Turning away a request that carries a badly formed credential does not answer the same way as turning away one that carries an unrecognised credential."
    hint_paths:
      - test/controllers/api/base_controller_test.rb
      - app/controllers/concerns/api_auth.rb

  # Replaces fix_sha 9c46157 (array-shaped tweet entities), which applied
  # backwards cleanly and still left the suite green: later code covered the
  # same case independently, so there was no defect to find. plant_check.rb
  # caught it before any trial was spent on it. 56ad37c was picked from
  # probe_candidates.rb's non-mirrored candidates, so the test file's name does
  # not hand over the implementation file the way tweets_helper_test.rb did.
  - id: bookmarks-01
    app: bookmarks
    slug: session-recovery-400
    fix_sha: 56ad37c
    impl_files:
      - app/services/bluesky/client.rb
    test_file: test/services/bluesky/client_post_by_uri_test.rb
    domain_hint: "Recovering an expired credential works only when the upstream API labels the rejection in one exact way. The same refusal worded differently goes untreated, so the lookup yields nothing and the item is reported as missing."
    hint_paths:
      - test/services/bluesky/client_post_by_uri_test.rb
      - app/services/bluesky/client.rb

  # ---------------------------------------------------------------------------
  # Grid expansion, 2026-08-18: four more bugs per app, for five per app.
  #
  # Every candidate below was read before it was listed. Four commits that
  # probe_candidates.rb reported as plantable were rejected on inspection
  # because they bundled an unrelated test change with the implementation
  # change, so reverting the implementation would not have failed the test:
  #
  #   campfire        c0cade5  only adds `require "ipaddr"`; the test change
  #                            tightens a port assertion the impl already meets
  #   postcraftstudio 9956b1a  impl changes insight-card rendering, test change
  #                            edits an unrelated samples-length assertion
  #   bookmarks       e51af84  impl drops .html_safe from an Avo resource, test
  #                            change is about twitter import return shapes
  #   bookmarks       37eff5b  impl adds persisted? guards, test change is blank
  #                            lines plus one unrelated CSS selector
  #
  # That is the same shape as the commit plant_check.rb caught as "NOT A BUG"
  # last run. Reading the diff is the cheap filter; plant_check is still the
  # one that decides.
  #
  # bookmarks has no usable non-mirrored candidate left: of its 19 plantable
  # commits only 3 withhold the defect path, one is already bookmarks-01 and
  # the other two are the rejects above. Its four new bugs are all mirrored, so
  # cond-none is weakest on this app. Recorded rather than papered over.
  # ---------------------------------------------------------------------------

